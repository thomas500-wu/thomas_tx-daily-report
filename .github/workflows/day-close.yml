name: 台指期報告 - 日盤收後

# 07:30 UTC = 15:30 台北。三大法人 / OI 資料約 15:00 才更新完,故排在 15:30。
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tx-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 產生報告
        run: python build/render.py --session day-close

      - name: Commit & push 產出
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有變更,略過 commit"
            exit 0
          fi
          git commit -m "report: day-close $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒(可能跟另一個 run 撞了),pull --rebase 後重試第 $i 次"
            git pull --rebase --autostash
          done
          echo "push 重試 3 次仍失敗"
          exit 1
