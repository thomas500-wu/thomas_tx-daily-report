name: 台指期報告 - 日盤收後

# 三大法人 / OI 約 15:00 更新完;但期交所 DailyMarketReportFut OpenAPI 常拖到傍晚
# 甚至隔天才有當日資料,加上 GitHub 排程本身會誤點 1~4 小時,所以多排幾個補跑時段。
# render.py 抓到舊資料只會產出舊頁,commit 步驟遇到「沒有變更」會自動略過,重複跑
# 是安全的;一旦期交所更新,下一個補跑就會把新頁推上去。
on:
  schedule:
    - cron: "30 7 * * 1-5"    # 15:30 台北 — 首次
    - cron: "30 10 * * 1-5"   # 18:30 台北 — 補跑
    - cron: "30 13 * * 1-5"   # 21:30 台北 — 補跑
    - cron: "30 16 * * 1-5"   # 00:30 台北(隔日)— 最後補跑
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tx-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 產生報告
        run: python build/render.py --session day-close

      - name: Commit & push 產出
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有變更,略過 commit"
            exit 0
          fi
          git commit -m "report: day-close $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒(可能跟另一個 run 撞了),pull --rebase 後重試第 $i 次"
            git pull --rebase --autostash
          done
          echo "push 重試 3 次仍失敗"
          exit 1
