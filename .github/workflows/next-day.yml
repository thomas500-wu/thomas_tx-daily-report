name: 台指期報告 - 夜盤回顧

# 夜盤 05:00 收盤,留緩衝等 TAIFEX 更新。cron 星期是 UTC 星期,22:30 UTC 已跨到台北
# 隔天,所以「UTC 週日~週四」才落在「台北週一~週五」的早上(週日 22:30 UTC =
# 週一 06:30 台北)。期交所 OpenAPI 常延遲,故多排兩個上午的補跑;抓到舊資料只會
# 產出舊頁,commit 遇到「沒有變更」自動略過,重複跑安全。
on:
  schedule:
    - cron: "30 22 * * 0-4"   # 06:30 台北 — 首次
    - cron: "30 0 * * 1-5"    # 08:30 台北 — 補跑
    - cron: "30 2 * * 1-5"    # 10:30 台北 — 補跑
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tx-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 產生報告(夜盤回顧 + 今日展望)
        run: python build/render.py --session next-day

      - name: Commit & push 產出
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有變更,略過 commit"
            exit 0
          fi
          git commit -m "report: next-day $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒(可能跟另一個 run 撞了),pull --rebase 後重試第 $i 次"
            git pull --rebase --autostash
          done
          echo "push 重試 3 次仍失敗"
          exit 1
